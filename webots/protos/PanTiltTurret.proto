# tags: static
# documentation url: https://github.com/reset1301/AutoTargeting
# keywords: robot, pan-tilt, turret, servo
#
# Упрощённая pan-tilt турель под AutoTargeting (крепление MaixCam).
# Система координат робота — FLU (Webots R2022a+): X вперёд, Y влево, Z вверх.
#
# Моторы:
#   "pan"  — yaw вокруг Z (горизонталь)
#   "tilt" — pitch вокруг Y (вертикаль камеры)
#
# Позиции моторов — радианы от механического центра (Arduino 90° → 0 rad).
# Arduino 0…180°:  webots_rad = (arduino_deg - 90) * pi / 180

PROTO PanTiltTurret [
  field SFVec3f    translation     0 0 0
  field SFRotation rotation        0 0 1 0
  field SFString   name            "pan_tilt_turret"
  field SFString   controller      "pan_tilt_demo"
  field MFString   controllerArgs  []
  field SFString   customData      ""
  field SFBool     supervisor      FALSE
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    # basicTimeStep задаётся в WorldInfo мира, не в Robot (R2025a).
    children [
      # Неподвижное основание (пьедестал), ось Z вверх.
      DEF BASE Solid {
        translation 0 0 0.04
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.25 0.27 0.3
              roughness 0.55
              metalness 0.15
            }
            geometry Cylinder {
              height 0.08
              radius 0.07
            }
          }
        ]
        name "base"
        boundingObject Cylinder {
          height 0.08
          radius 0.07
        }
        physics Physics {
          density -1
          mass 0.4
        }
      }

      # PAN (yaw): вращение вокруг вертикали Z.
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0 0 0.09
          dampingConstant 0.2
          staticFriction 0.05
        }
        device [
          RotationalMotor {
            name "pan"
            acceleration 12
            minPosition -1.5708
            maxPosition 1.5708
            maxVelocity 4
            maxTorque 1.5
            sound ""
          }
          PositionSensor {
            name "pan_sensor"
            resolution -1
          }
        ]
        endPoint DEF PAN_YAW Solid {
          translation 0 0 0.09
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.45 0.48 0.52
                roughness 0.4
                metalness 0.25
              }
              geometry Cylinder {
                height 0.02
                radius 0.055
              }
            }
            Transform {
              translation 0 0 0.035
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.35 0.38 0.42
                    roughness 0.45
                    metalness 0.2
                  }
                  geometry Box {
                    size 0.04 0.02 0.05
                  }
                }
              ]
            }

            # TILT (pitch): вращение вокруг Y (влево) — кивок камеры.
            HingeJoint {
              jointParameters HingeJointParameters {
                axis 0 1 0
                anchor 0 0 0.06
                dampingConstant 0.15
                staticFriction 0.05
              }
              device [
                RotationalMotor {
                  name "tilt"
                  acceleration 12
                  minPosition -1.5708
                  maxPosition 1.5708
                  maxVelocity 4
                  maxTorque 1.2
                  sound ""
                }
                PositionSensor {
                  name "tilt_sensor"
                  resolution -1
                }
              ]
              endPoint DEF TILT_HEAD Solid {
                translation 0 0 0.06
                children [
                  # Корпус камеры; «смотрит» вдоль +X (вперёд в FLU).
                  # Размеры корпуса: длина Lx=0.07, ширина Wy=0.045, высота Hz=0.035.
                  Transform {
                    translation 0.01 0 0.02
                    children [
                      Shape {
                        appearance PBRAppearance {
                          baseColor 0.12 0.12 0.14
                          roughness 0.35
                          metalness 0.05
                        }
                        geometry Box {
                          size 0.07 0.045 0.035
                        }
                      }
                    ]
                  }
                  # Два параллелепипеда слева/справа: дети TILT_HEAD → крутятся вместе с камерой.
                  # Длина = 5×Lx = 0.35; квадратное сечение = 1.5×Wy = 0.0675 × 0.0675.
                  # Центр масс на оси tilt (локальная Y через начало TILT_HEAD): translation x=0, z=0.
                  # Зазор от бока камеры = 1×Wy = 0.045 → |Y| =
                  #   Wy/2 + gap + section/2 = 0.0225 + 0.045 + 0.03375 = 0.10125.
                  Transform {
                    translation 0 0.10125 0
                    children [
                      DEF BEAM_SHAPE Shape {
                        appearance PBRAppearance {
                          baseColor 0.55 0.42 0.22
                          roughness 0.65
                          metalness 0.05
                        }
                        geometry Box {
                          size 0.35 0.0675 0.0675
                        }
                      }
                    ]
                  }
                  Transform {
                    translation 0 -0.10125 0
                    children [
                      USE BEAM_SHAPE
                    ]
                  }
                  # Поперечная ось: соединяет брусья и узел камеры.
                  # Диаметр = Wy/2 = 0.0225 → radius 0.01125.
                  # Длина = зазор между внутренними гранями брусьев =
                  #   2*|Y| − section = 0.2025 − 0.0675 = 0.135.
                  # Cylinder по умолчанию вдоль Z → поворот на π/2 вокруг X → ось вдоль Y.
                  Transform {
                    translation 0 0 0
                    rotation 1 0 0 1.5708
                    children [
                      Shape {
                        appearance PBRAppearance {
                          baseColor 0.4 0.42 0.45
                          roughness 0.35
                          metalness 0.35
                        }
                        geometry Cylinder {
                          height 0.135
                          radius 0.01125
                        }
                      }
                    ]
                  }
                  # Объектив спереди (+X).
                  Transform {
                    translation 0.05 0 0.02
                    rotation 0 1 0 1.5708
                    children [
                      Shape {
                        appearance PBRAppearance {
                          baseColor 0.05 0.45 0.75
                          roughness 0.2
                          metalness 0.4
                        }
                        geometry Cylinder {
                          height 0.012
                          radius 0.012
                        }
                      }
                    ]
                  }
                  # Маркер «верх», чтобы глазом читать tilt.
                  Transform {
                    translation 0.01 0 0.04
                    children [
                      Shape {
                        appearance PBRAppearance {
                          baseColor 0.9 0.55 0.1
                          roughness 0.5
                          metalness 0
                        }
                        geometry Box {
                          size 0.015 0.015 0.008
                        }
                      }
                    ]
                  }
                ]
                name "camera_head"
                boundingObject Group {
                  children [
                    Transform {
                      translation 0.01 0 0.02
                      children [
                        Box {
                          size 0.07 0.045 0.035
                        }
                      ]
                    }
                    Transform {
                      translation 0 0.10125 0
                      children [
                        Box {
                          size 0.35 0.0675 0.0675
                        }
                      ]
                    }
                    Transform {
                      translation 0 -0.10125 0
                      children [
                        Box {
                          size 0.35 0.0675 0.0675
                        }
                      ]
                    }
                    Transform {
                      translation 0 0 0
                      rotation 1 0 0 1.5708
                      children [
                        Cylinder {
                          height 0.135
                          radius 0.01125
                        }
                      ]
                    }
                  ]
                }
                physics Physics {
                  density -1
                  mass 0.3
                }
              }
            }
          ]
          name "pan_yaw"
          boundingObject Cylinder {
            height 0.02
            radius 0.055
          }
          physics Physics {
            density -1
            mass 0.2
          }
        }
      }
    ]
  }
}
